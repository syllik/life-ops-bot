[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "life-ops-bot"
version = "0.1.0"
description = "Single-user Telegram interface for self-hosted GitHub Issues"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "aiogram>=3.31,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
life-ops-bot = "life_ops_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/life_ops_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=life_ops_bot --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
